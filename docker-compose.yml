# For future VPS use — there is no Docker on the Termux dev device.
# Local dev uses the native Termux Postgres cluster instead (see README).
#
# The postgres:16 image ships the contrib modules `unaccent` and `pg_trgm`;
# they are enabled by the SQL migration in prisma/migrations/.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_interface_kit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_interface_kit"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
